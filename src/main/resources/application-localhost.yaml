spring:
  docker:
    compose:
      file: compose.localhost.yaml
  security:
    http:
      redirects:
        same-site: strict
    jwt:
      secret: ${DEV_JWT_SECRET}
      expiration: 86400000
      refresh-token:
        expiration: 604800000
  application:
    name: "dictionary"
  datasource:
    url: ${DEV_DB_URL}
    username: ${DEV_DB_USER}
    password: ${DEV_DB_PASS}"
gg:
  jte:
    templateLocation: src/main/jte
    templateSuffix: .jte
    developmentMode: true
    usePrecompiledTemplates: false
logging:
  level:
    org:
#      springframework.jdbc.core.JdbcTemplate: DEBUG
#      org.springframework.security.web.FilterChainProxy: DEBUG
  logging.level.org.springframework.security: TRACE
server:
  servlet:
    session:
      cookie:
        secure: false
        http-only: true
        same-site: lax
  compression:
    enabled: true
    min-response-size: 2048
app:
  security:
    cookie-secure: false
